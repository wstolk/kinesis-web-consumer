version: 1

merge:
  # Only merge when all required status checks pass
  trigger:
    labels: ["merge when ready"]

  # Delete the branch after merge
  delete_after_merge: true

  # Merge method
  method: squash

  options:
    squash:
      # Use the PR title and body as the commit message
      title: pull_request_title
      body: summarize_commits

  # Require all required status checks to pass
  required_statuses:
    - "security-audit"
    - "build-verify"

update:
  # Keep PRs up to date with main
  trigger:
    labels: ["merge when ready"]
